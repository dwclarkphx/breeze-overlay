# Breeze Overlay — single-service deployment.
#
#   cp -n env.breeze .env     # -n: keeps a .env you already have
#   # edit .env: at least BREEZE_CONTACT, and BREEZE_API_KEY off an isolated LAN
#   docker compose up -d --build
#
# Settings go in .env, never in env.breeze — that one is reference only,
# tracked by git and published with the source. Compose loads .env by itself and substitutes it into
# the ports mapping and the environment block below; only settings listed in
# that block reach the server.
#
# Then open http://localhost:${BREEZE_PORT}/ and point vMix or OBS at
# http://<this-host>:${BREEZE_PORT}/play/demo-1iixd/l3rd-name-2a94g

services:
  breeze:
    build:
      context: .
      target: runtime
    image: breeze-overlay:local
    container_name: breeze-overlay
    restart: unless-stopped

    # Host and container port are deliberately the same value. The server logs
    # its LAN browser-source URLs using its own listen port, and those URLs are
    # copied straight into a switcher — publishing 8080:7331 would print a URL
    # that does not work from the vMix machine. Change BREEZE_PORT in .env and
    # both sides move together.
    ports:
      - "${BREEZE_PORT:-7331}:${BREEZE_PORT:-7331}"

    # The console dashboard (BREEZE_CONSOLE=dashboard) needs a terminal. Uncomment
    # and watch it with `docker attach breeze-overlay` (detach: Ctrl+P Ctrl+Q —
    # Ctrl+C there stops the server). Without it the server logs normally, and
    # `docker compose logs` stays readable, which is why it is off by default.
    # tty: true

    environment:
      BREEZE_PORT: "${BREEZE_PORT:-7331}"
      # 0.0.0.0 inside the container is the container's own interface, not the
      # host's — the ports mapping above is what exposes it. Leave it be.
      BREEZE_HOST: "0.0.0.0"
      BREEZE_DATA_DIR: "/app/data"
      BREEZE_LOG_LEVEL: "${BREEZE_LOG_LEVEL:-info}"

      # Every setting the server reads must be listed here to reach the
      # container — a line in .env that is not passed through below is ignored
      # without a word. BREEZE_LOCALE and BREEZE_CONSOLE were missing until
      # 0.73.0, so a language set in .env never took effect under Docker.
      BREEZE_LOCALE: "${BREEZE_LOCALE:-en}"
      BREEZE_CONSOLE: "${BREEZE_CONSOLE:-log}"
      BREEZE_TRANSCODE_CONCURRENCY: "${BREEZE_TRANSCODE_CONCURRENCY:-1}"

      # Who this server is, for outgoing feed requests. Set it — see the
      # User-Agent section of the README.
      BREEZE_CONTACT: "${BREEZE_CONTACT:-}"

      # Empty means no auth on mutating /api/* calls. Fine on an isolated
      # production LAN, not fine anywhere a laptop can reach.
      BREEZE_API_KEY: "${BREEZE_API_KEY:-}"

      BREEZE_DATA_POLLING: "${BREEZE_DATA_POLLING:-1}"
      BREEZE_DATA_ALLOW_HOSTS: "${BREEZE_DATA_ALLOW_HOSTS:-}"
      BREEZE_DATA_SECRETS: "${BREEZE_DATA_SECRETS:-}"

      # For anything with newlines in it — notably a Google service-account key.
      # Uncomment together with the bind mount below.
      # BREEZE_DATA_SECRETS_FILE: "/run/secrets/breeze-data.json"

    volumes:
      # Projects and uploaded assets. Named rather than a bind mount so the
      # container's uid 1000 owns it without a host-side chown; `docker compose
      # down` keeps it, `down -v` destroys every project on the server.
      - breeze-data:/app/data

      # Credentials, read-only, kept out of the image and out of `docker inspect`.
      # - ./secrets/breeze-data.json:/run/secrets/breeze-data.json:ro

      # A font a graphic names has to exist inside the container, not just on
      # the host — an unresolved family falls back silently and the lower third
      # goes to air in the wrong typeface. Share the host's fonts, or bake them
      # into the image.
      # - /usr/share/fonts:/usr/share/fonts:ro

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  breeze-data:
