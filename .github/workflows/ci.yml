name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Reads the packageManager field in package.json for the pnpm version
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # Before the install, deliberately. `--frozen-lockfile` below already
      # refuses a stale lockfile, but it reports the failure as an install
      # error partway through resolution; this names the package and says how
      # to regenerate it. Costs a second and turns a confusing CI failure into
      # an instruction.
      - name: Lockfile up to date
        run: node scripts/check-lockfile.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Belt to the frozen install's braces. On a clean CI checkout this can
      # only fail if the lockfile and the manifests disagree in a way
      # --frozen-lockfile tolerated, which would be worth knowing about here
      # rather than as a bundler error in the build step below.
      - name: Dependencies installed
        run: node scripts/check-installed.mjs

      # Cheap, and first: a bump that only landed in the root package.json is
      # the kind of mistake that otherwise ships and then gets quoted back in a
      # bug report. The unit suite asserts this too; failing here names the file.
      - name: Version consistency
        run: pnpm version:check

      # MPL-2.0 copyleft is file-scoped: a file without the Exhibit A notice
      # has quietly left the license. Cheap, so it runs before the build.
      - name: License headers
        run: pnpm license:check

      # Attribution for what a user receives, generated from the installed
      # production tree. Runs before the build for the same reason as the two
      # checks above — it needs only the install, and a dependency added
      # without regenerating this is a licensing miss, not a test failure.
      - name: Third-party notices
        run: pnpm notices:check

      # Build FIRST — dev/test do not rebuild workspace deps,
      # so skipping this tests a stale bundle.
      #
      # This is also what stages GSAP into apps/server/public/vendor/: it is no
      # longer bundled, so a build that did not run would leave the e2e suite
      # loading a script tag that 404s, and every playback assertion failing
      # for a reason no test name would mention.
      - name: Build
        run: pnpm build

      # Confirms the staged GSAP matches the pinned version. Separate from the
      # build so that a mismatch reads as "GSAP is not staged" rather than
      # surfacing later as a graphic that will not animate.
      - name: GSAP staged
        run: pnpm vendor:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E tests
        run: pnpm test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
